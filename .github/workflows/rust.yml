# The Rust checks of scripts/check.sh (everything it runs before scripts/prove.sh).
# The proofs are checked by proofs.yml.
name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no arguments, rustup installs the toolchain rust-toolchain.toml names, with the
      # components it lists.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Rust version (proofs/PINS)
        run: |
          RUST="$(sed -n 's/^RUST=//p' proofs/PINS)"
          rustc --version
          case "$(rustc --version)" in
            "rustc $RUST "*) ;;
            *) echo "FAIL: rustc is not $RUST (see rust-toolchain.toml)" >&2; exit 1 ;;
          esac

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo clippy (std feature)
        run: cargo clippy --all-targets --features std -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo test (std feature)
        run: cargo test --features std

      - name: cargo doc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --quiet

      - name: cargo doc (std feature)
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --quiet --features std
