[package]
name = "conjure-dsp-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
description = "Audio DSP building blocks with Lean proofs about the code."
repository = "https://github.com/michaeljancsy/ConjureDSPLib"
readme = "README.md"
keywords = ["dsp", "audio", "filter", "lean", "verification"]
categories = ["multimedia::audio", "no-std::no-alloc", "mathematics"]
# The proofs, scripts and generated Lean are not needed to use the crate.
include = ["/src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-APACHE", "/NOTICE"]

[features]
# Adds the fused multiply-add functions (`step_fma_f64`, `process_fma_f64` and the others), which
# call `f64::mul_add` and `f32::mul_add`. Those are in `std`, not `core`, on stable Rust, so this
# feature links the standard library. Off by default; it adds functions and links std, and changes
# no other function.
std = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
# Pure-Rust maths (tan, pow, sqrt) for designing filter coefficients. Pinned exactly; default
# features off, so libm uses its portable Rust code rather than CPU-specific instructions. That it
# gives the same results on every platform is not proved (32-bit x86 without SSE2, for one, rounds
# differently).
libm = { version = "=0.2.16", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# This library must never panic in audio code.
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
std_instead_of_core = "warn"
