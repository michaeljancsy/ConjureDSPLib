[package]
name = "conjure-dsp-lib"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Shared DSP maths for ConjureDSP plug-ins, with Lean proofs about the code."
repository = "https://github.com/michaeljancsy/ConjureDSPLib"
publish = false

[dependencies]
# Pure-Rust maths (tan, pow, sqrt) for designing filter coefficients. Pinned exactly; default
# features off, so no architecture-specific code paths: the same results on every platform.
libm = { version = "=0.2.16", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
# This library must never panic in audio code.
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
std_instead_of_core = "warn"
